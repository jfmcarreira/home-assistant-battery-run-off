[project]
name = "home-assistant-battery-runtime"
version = "0.1.1"
description = "Predict when a Home Assistant home battery will reach reserve"
readme = "README.md"
requires-python = ">=3.14.2"
license = "GPL-3.0-only"

[dependency-groups]
dev = [
    "pytest-cov>=6.2,<8",
    "pytest-homeassistant-custom-component==0.13.356",
    "ruff>=0.12,<1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
addopts = [
    "--strict-config",
    "--strict-markers",
    "--cov=custom_components.battery_runtime",
    "--cov-branch",
    "--cov-report=term-missing",
    "--cov-report=xml",
    "-ra",
]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["custom_components/battery_runtime"]

[tool.coverage.report]
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
show_missing = true

[tool.ruff]
line-length = 88
src = ["custom_components", "tests"]
target-version = "py314"

[tool.ruff.lint]
select = [
    "B",
    "E4",
    "E7",
    "E9",
    "F",
    "I",
    "RUF",
    "SIM",
    "UP",
]

[tool.ruff.lint.isort]
known-first-party = ["custom_components"]

[tool.ruff.format]
docstring-code-format = true
quote-style = "double"

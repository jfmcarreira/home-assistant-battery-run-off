    <path d="M248 180v152" fill="none" stroke="#8AF0CB" stroke-width="8" opacity="0.5"/>
  </g>

  <circle cx="314" cy="256" r="91" fill="#102A38" stroke="#F5F7F2" stroke-width="22"/>
  <path d="M314 191v14M379 256h-14M314 321v-14M249 256h14" fill="none" stroke="#66E3B4" stroke-linecap="round" stroke-width="10"/>
  <path d="M314 256v-43M314 256l39 26" fill="none" stroke="#FFD166" stroke-linecap="round" stroke-linejoin="round" stroke-width="18"/>
  <circle cx="314" cy="256" r="12" fill="#FFD166"/>

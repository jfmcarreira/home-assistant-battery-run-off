<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title description">
  <title id="title">Home Battery Runtime icon</title>
  <desc id="description">A partially charged home battery combined with a clock.</desc>
  <defs>
    <linearGradient id="background" x1="96" y1="72" x2="416" y2="440" gradientUnits="userSpaceOnUse">
      <stop stop-color="#173B4D"/>
      <stop offset="1" stop-color="#0A1C28"/>
    </linearGradient>
    <linearGradient id="charge" x1="108" y1="176" x2="250" y2="336" gradientUnits="userSpaceOnUse">
      <stop stop-color="#66E3B4"/>
      <stop offset="1" stop-color="#22B8A7"/>
    </linearGradient>
    <clipPath id="battery-interior">
      <rect x="106" y="180" width="270" height="152" rx="26"/>

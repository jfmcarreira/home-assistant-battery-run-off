  </defs>

  <circle cx="256" cy="256" r="238" fill="url(#background)"/>
  <circle cx="256" cy="256" r="231" fill="none" stroke="#235066" stroke-width="8"/>

  <rect x="82" y="156" width="320" height="200" rx="48" fill="#0A1C28" stroke="#F5F7F2" stroke-width="26"/>
  <rect x="399" y="218" width="35" height="76" rx="12" fill="#F5F7F2"/>
